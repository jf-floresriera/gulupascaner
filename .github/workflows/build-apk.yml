# Compila el APK de GulupaScan (app/android) en GitHub.
#
# - En cada push que toque app/android: el APK queda en la pestaña Actions
#   (entra a la ejecución › sección "Artifacts" › GulupaScan-apk).
# - Si creas una etiqueta v* (ej. v0.3.0): además publica el APK en "Releases".
# - También se puede lanzar a mano: Actions › Compilar APK › Run workflow.
name: Compilar APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/android/**"
      - ".github/workflows/build-apk.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "app/android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - id: checkout
        uses: actions/checkout@v5

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - id: android
        name: Instalar Android SDK
        working-directory: .
        run: |
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - id: gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log || {
            # Publica los errores como anotaciones visibles en GitHub.
            grep -E '^e: |error:|What went wrong|ERROR:' -A3 build.log | head -60 | while IFS= read -r line; do
              echo "::error title=Gradle::${line}"
            done
            exit 1
          }

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GulupaScan-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -la dist

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: GulupaScan-apk
          path: app/android/dist/*.apk
          retention-days: 30

      - name: Publicar en Releases (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/dist/*.apk
          generate_release_notes: true

      - name: Reportar error como comentario del commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Falló la compilación del APK"
            echo '```'
            if [ -f build.log ]; then
              (grep -E '^e: |^w: .*error|What went wrong|ERROR|FAILED|Could not' -A4 build.log || tail -n 80 build.log) | head -n 120
            else
              echo "No existe build.log: falló un paso antes de Gradle."
              echo "checkout=${{ steps.checkout.outcome }} java=${{ steps.java.outcome }} android=${{ steps.android.outcome }} gradle=${{ steps.gradle.outcome }}"
              ls -la . gradle/wrapper 2>&1 | head -30
            fi
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md
