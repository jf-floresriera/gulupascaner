# Compila el APK de GulupaScan (app/android) en GitHub.
#
# - En cada push que toque app/android: el APK queda en la pestaña Actions
#   (entra a la ejecución › sección "Artifacts" › GulupaScan-apk).
# - Si creas una etiqueta v* (ej. v0.3.0): además publica el APK en "Releases".
# - También se puede lanzar a mano: Actions › Compilar APK › Run workflow.
name: Compilar APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/android/**"
      - ".github/workflows/build-apk.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "app/android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GulupaScan-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -la dist

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: GulupaScan-apk
          path: app/android/dist/*.apk
          retention-days: 30

      - name: Publicar en Releases (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/android/dist/*.apk
          generate_release_notes: true
